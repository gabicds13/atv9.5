
name: Publicar imagem Docker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Criar e publicar imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/gabicds13/atv9.5:latest
          
      - name: Atualizar Azure
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_DEPLOY_WEBHOOK_URL }}
        run: |
          test -n "$WEBHOOK_URL" || exit 1
          curl --fail --silent --show-error \
            -X POST "$WEBHOOK_URL"

